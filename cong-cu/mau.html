<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a3141b">
<title>{{TIEU_DE}}</title>
<meta name="description" content="{{TIEU_DE_NHO}} – {{TIEU_DE}} ({{MOC_THOI_GIAN}})">
{{ICON}}
<style>
:root{--red:#a3141b;--gold:#c99a2e;--ink:#1d1b19;--muted:#6b645c;--bg:#faf7f2;--line:#e7dfd2;--nav:56px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav) + 12px);-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.75 "Times New Roman",Georgia,"Noto Serif",serif;overflow-x:hidden;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
.hero{background:linear-gradient(160deg,#7d0e14,var(--red) 60%,#b8321f);color:#fff;text-align:center;padding:40px 20px 34px}
.logo{width:110px;height:110px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.kicker{font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#ffd98a;margin:18px 0 6px}
.hero h1{font-size:clamp(24px,5vw,38px);line-height:1.25;margin:0 auto;max-width:760px}
.date{margin-top:10px;color:#ffe9bd}
/* thanh câu hỏi: nền đặc (không dùng blur) để cuộn nhẹ trên điện thoại */
.bar{position:sticky;top:0;z-index:10;height:var(--nav);background:var(--bg);border-bottom:1px solid var(--line);font:600 15px system-ui,sans-serif}
.bar .in{max-width:820px;height:100%;margin:auto;display:flex;align-items:center;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.bar .in::-webkit-scrollbar{display:none}
.bar a{flex:none;scroll-snap-align:center;text-decoration:none;color:var(--red);border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;transition:background .2s,color .2s}
.bar a.on{background:var(--red);color:#fff;border-color:var(--red)}
.prog{position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);will-change:transform}
main{max-width:820px;margin:0 auto;padding:8px 18px 70px}
.toc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:26px 0}
.toc h2{font:700 14px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc ol{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;line-height:1.45}
.toc li:first-child a{border-top:0}
.toc b{flex:none;color:var(--red)}
.toc span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qtitle{font-size:20px;line-height:1.5;background:#fff4e0;border-left:5px solid var(--gold);border-radius:10px;padding:16px 18px;margin:34px 0 18px}
.qnum{display:inline-block;background:var(--red);color:#fff;font:700 14px system-ui,sans-serif;border-radius:6px;padding:2px 10px;margin-right:6px;vertical-align:2px}
.ans{font-weight:700;color:var(--red)}
p{text-align:justify;margin:0 0 14px}
/* ảnh có sẵn width/height -> giữ chỗ trước, trang không bị nhảy khi ảnh tải */
main img{height:auto;max-width:100%;display:inline-block;border-radius:6px;margin:6px auto;background:#eee6da}
p:has(> img){text-align:center}
.tw{overflow-x:auto;margin:16px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:16px;line-height:1.5;background:#fff}
td,th{border:1px solid var(--line);padding:8px;vertical-align:top}
blockquote{margin:0 0 14px;padding-left:16px;border-left:3px solid var(--line)}
footer{text-align:center;color:var(--muted);font:14px system-ui,sans-serif;padding:30px 16px 40px;border-top:1px solid var(--line)}
.top{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;text-decoration:none;font:22px system-ui;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s}
.top.show{opacity:1;pointer-events:auto}
@media (max-width:600px){body{font-size:17px}p{text-align:left}.qtitle{font-size:18px}}
</style>
</head>
<body>
<header class="hero" id="dau-trang">
{{LOGO}}
<div class="kicker">{{TIEU_DE_NHO}}</div>
<h1>{{TIEU_DE}}</h1>
<div class="date">{{MOC_THOI_GIAN}}</div>
</header>
<nav class="bar"><div class="in"><a href="#mo-dau">Mở đầu</a>{{NUT_CAU}}</div><div class="prog"></div></nav>
<main>
<div class="toc"><h2>Mục lục</h2><ol>
<li><a href="#mo-dau"><b>Mở đầu</b></a></li>
{{MUC_LUC}}
</ol></div>
<section id="mo-dau">
{{NOI_DUNG}}
</section>
</main>
<footer>{{CHAN_TRANG}}</footer>
<a class="top" href="#dau-trang" aria-label="Lên đầu trang">↑</a>
<script>
(function(){
  var strip=document.querySelector('.bar .in'), prog=document.querySelector('.prog'), top=document.querySelector('.top');
  var links=[].slice.call(strip.querySelectorAll('a'));
  var marks=links.map(function(a){var s=document.querySelector(a.getAttribute('href'));return s&&(s.querySelector('h2')||s);});
  var cur=-1, ticking=false;
  function setActive(i){
    if(i===cur||i<0)return; cur=i;
    links.forEach(function(l,k){l.classList.toggle('on',k===i);});
    var a=links[i]; // chỉ cuộn ngang thanh nút, không đụng tới cuộn dọc của trang
    strip.scrollTo({left:a.offsetLeft-(strip.clientWidth-a.offsetWidth)/2,behavior:'smooth'});
  }
  function update(){
    ticking=false;
    var y=window.scrollY, h=document.documentElement.scrollHeight-innerHeight;
    prog.style.transform='scaleX('+(h>0?y/h:0)+')';
    top.classList.toggle('show',y>innerHeight);
    var line=y+innerHeight*0.35, i=-1;
    for(var k=0;k<marks.length;k++){ if(marks[k]&&marks[k].getBoundingClientRect().top+y<=line) i=k; }
    setActive(i<0?0:i);
  }
  addEventListener('scroll',function(){ if(!ticking){ticking=true;requestAnimationFrame(update);} },{passive:true});
  addEventListener('resize',update,{passive:true});
  update();
})();
</script>
</body>
</html>
